<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Les Nail Salon | Arnold, MD</title>
    <meta
      name="description"
      content="Les Nail Salon in Arnold, MD offers luxury manicures, pedicures, nail art, and spa services in a relaxing boutique setting."
    />
    <style>
      :root {
        --bg: #fffaf7;
        --panel: #ffffff;
        --blush: #f7dfe6;
        --pink: #d77a90;
        --pink-dark: #b65c78;
        --rose: #f3c7d3;
        --brown: #422f2d;
        --muted: #6d5b5d;
        --line: rgba(66, 47, 45, 0.08);
        --shadow: 0 25px 60px rgba(123, 82, 92, 0.12);
        --radius: 28px;
        --container: 1180px;
      }

      * { box-sizing: border-box; }

      html {
        scroll-behavior: smooth;
      }

      body {
        margin: 0;
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        background: var(--bg);
        color: var(--brown);
        line-height: 1.6;
      }

      img {
        max-width: 100%;
        display: block;
      }

      a {
        text-decoration: none;
        color: inherit;
      }

      .container {
        width: min(var(--container), calc(100% - 28px));
        margin: 0 auto;
      }

      .topbar {
        position: sticky;
        top: 0;
        z-index: 1000;
        background: rgba(255, 250, 247, 0.84);
        backdrop-filter: blur(14px);
        border-bottom: 1px solid var(--line);
      }

      .nav {
        display: flex;
        align-items: center;
        justify-content: space-between;
        height: 78px;
      }

      .brand {
        display: flex;
        align-items: center;
        gap: 12px;
        font-weight: 800;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        font-size: 0.8rem;
      }

      .brand-mark {
        width: 36px;
        height: 36px;
        border-radius: 50%;
        background: linear-gradient(135deg, #f7dfe6, #d77a90 55%, #b65c78);
        position: relative;
        box-shadow: inset 0 0 12px rgba(255,255,255,0.8);
      }

      .brand-mark::before,
      .brand-mark::after {
        content: "";
        position: absolute;
        inset: 8px;
        border-radius: 50%;
        border: 2px solid rgba(255,255,255,0.8);
      }

      .brand-mark::after {
        inset: 14px 7px 7px 7px;
        border-width: 1.5px;
      }

      .nav-links {
        display: flex;
        align-items: center;
        gap: 26px;
        color: var(--muted);
      }

      .nav-links a:hover {
        color: var(--pink-dark);
      }

      .nav-actions {
        display: flex;
        align-items: center;
        gap: 12px;
      }

      .btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        border-radius: 999px;
        padding: 0.9rem 1.5rem;
        font-weight: 700;
        border: none;
        cursor: pointer;
        transition: transform 0.2s ease, box-shadow 0.2s ease;
      }

      .btn:hover {
        transform: translateY(-2px);
      }

      .btn-primary {
        background: linear-gradient(135deg, var(--pink), var(--pink-dark));
        color: #fff;
        box-shadow: 0 16px 28px rgba(183, 92, 120, 0.25);
      }

      .btn-secondary {
        background: rgba(215, 122, 144, 0.08);
        color: var(--pink-dark);
        border: 1px solid rgba(215, 122, 144, 0.18);
      }

      .menu-toggle {
        display: none;
        border: 1px solid var(--line);
        background: transparent;
        border-radius: 12px;
        width: 44px;
        height: 44px;
        cursor: pointer;
        font-size: 1.4rem;
      }

      .hero {
        position: relative;
        overflow: hidden;
        padding: 72px 0 48px;
      }

      .hero::before {
        content: "";
        position: absolute;
        inset: 0;
        background:
          radial-gradient(circle at 15% 20%, rgba(243, 199, 211, 0.8), transparent 24%),
          radial-gradient(circle at 80% 14%, rgba(240, 206, 214, 0.75), transparent 24%),
          linear-gradient(135deg, #fffaf7 0%, #fff5f8 100%);
        z-index: -1;
      }

      .hero-grid {
        display: grid;
        grid-template-columns: 1.1fr 0.9fr;
        gap: 42px;
        align-items: center;
      }*
